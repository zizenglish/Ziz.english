<html lang="en">
<head>

<title>The Perfect Saturday — Urban Weekend Challenge</title>
<style>
:root{--navy:#101b2b;--navy2:#19283c;--yellow:#ffd45a;--paper:#f5f2e9;--ink:#172338;--muted:#aab6c5;--blue:#8db7d8;--green:#79c7a0;--red:#e78375;--line:#d8d8d0;--shadow:0 16px 45px #07111d55}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:white;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0} .shell{max-width:1180px;margin:auto;padding:22px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.12em;font-size:12px;color:var(--yellow)}.scorebox{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.scorebox strong{color:white;font-size:17px}.progress-wrap{height:7px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress{height:100%;width:0;background:var(--yellow);transition:width .35s}.missionline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.missionline b{color:var(--yellow)}.hero{padding:36px 0 28px;display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center}.eyebrow{color:var(--yellow);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.96;letter-spacing:-.055em;margin:14px 0}.hero h1 span{color:var(--yellow)}.hero p{color:#c1cbd5;line-height:1.6;max-width:630px}.city-art{background:linear-gradient(145deg,#253d54,#192a3b);border:1px solid #ffffff20;border-radius:24px;min-height:220px;display:flex;align-items:end;justify-content:center;overflow:hidden;position:relative;padding:24px}.city-art:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#ffd45a35,transparent 35%)}.building{display:flex;gap:8px;align-items:end;z-index:1}.tower{width:45px;background:#7893a9;border-radius:5px 5px 0 0;position:relative}.tower:after{content:"";position:absolute;inset:12px 8px;background:repeating-linear-gradient(0deg,transparent 0 14px,#ffd45a 15px 19px);opacity:.8}.tower:nth-child(1){height:95px}.tower:nth-child(2){height:145px;width:58px;background:#4c6e89}.tower:nth-child(3){height:115px}.tower:nth-child(4){height:165px;width:52px;background:#607f98}.tower:nth-child(5){height:78px}.sun{position:absolute;right:15%;top:20px;width:52px;height:52px;border-radius:50%;background:var(--yellow);box-shadow:0 0 45px #ffd45a66}.panel{background:var(--paper);color:var(--ink);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:var(--shadow)}.panel h2{font-size:clamp(25px,4vw,38px);letter-spacing:-.035em;margin:5px 0 10px}.panel h3{margin:0 0 10px}.sub{color:#667184;line-height:1.55}.tag{display:inline-flex;padding:6px 10px;border-radius:30px;background:#e7e4da;color:#506074;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.btn{background:var(--navy);color:white;border-radius:12px;padding:12px 18px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 18px #101b2b30}.btn.yellow{background:var(--yellow);color:var(--ink)}.btn.ghost{background:#e7e9e8;color:var(--ink)}.btn.small{padding:8px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice,.tile,.event-option{border:2px solid #dedfd9;background:#fff;border-radius:14px;padding:14px;text-align:left;color:var(--ink);transition:.16s;min-height:65px}.choice:hover,.tile:hover,.event-option:hover{border-color:#829bb0;transform:translateY(-1px)}.choice.selected,.tile.selected{border-color:var(--yellow);background:#fff8df}.choice.correct{border-color:var(--green);background:#e9f5ee}.choice.wrong{border-color:var(--red);background:#faece9}.choice b{display:block;margin-bottom:4px}.feedback{padding:12px 14px;border-radius:12px;background:#e8eee9;color:#315b47;margin-top:14px;line-height:1.5}.feedback.bad{background:#faece9;color:#8b4038}.question{font-size:19px;font-weight:800;margin:18px 0 14px}.muted{color:#718092}.pill{display:inline-block;background:#e6ebee;border-radius:20px;padding:5px 9px;margin:3px;font-size:12px}.wordbank{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.draggable{padding:9px 12px;background:#e8edf0;border:1px solid #cbd5dc;border-radius:10px;cursor:grab;color:#25364a;font-weight:700}.dropzone{border:2px dashed #aab6bc;border-radius:12px;padding:12px;min-height:50px;background:#fbfaf5}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flashcard{position:relative;min-height:154px;padding:0;border:0;background:transparent;color:var(--ink);text-align:left;perspective:1000px}
.flashcard-inner{position:relative;display:block;min-height:154px;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1)}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;min-height:154px;padding:19px;border:1px solid #e1e1d9;border-radius:15px;background:#fff;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 12px #14243a0a}
.flashcard-front{border-top:4px solid var(--yellow)}
.flashcard-front strong{font-size:18px;line-height:1.3}
.flashcard-front .tap-hint{margin-top:15px;color:#7b8795;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.flashcard-back{transform:rotateY(180deg);background:#fff9e7;border-color:#e8d69b}
.flashcard-back .meaning{font-weight:700;color:#26364b;margin-bottom:9px}
.flashcard-back .example{font-size:14px;color:#5f6d7d;line-height:1.45}
.flashcard:focus-visible{outline:3px solid #789bb6;outline-offset:4px;border-radius:15px}
@media(max-width:620px){.vocab{grid-template-columns:1fr}.flashcard,.flashcard-inner,.flashcard-face{min-height:135px}}.inline-select{padding:8px;border:1px solid #bfc9cc;border-radius:9px;background:white;color:var(--ink)}.sequence-list{display:grid;gap:8px}.seq{padding:12px;border-radius:10px;background:#e8edf0;display:flex;align-items:center;justify-content:space-between;gap:10px}.seq button{background:#d4dce0;border-radius:8px;padding:5px 10px}.mapgrid{display:grid;grid-template-columns:1fr 300px;gap:16px}.citymap{background:#e5e9df;border-radius:16px;padding:16px;position:relative;min-height:370px;overflow:hidden;background-image:linear-gradient(45deg,transparent 47%,#fff9 48%,#fff9 52%,transparent 53%),linear-gradient(-35deg,transparent 47%,#fff9 48%,#fff9 52%,transparent 53%);background-size:130px 110px}.mapspot{position:absolute;background:var(--navy);color:white;border:3px solid white;border-radius:12px;padding:7px 9px;font-size:11px;font-weight:800;box-shadow:0 3px 10px #2333;cursor:pointer}.mapspot.active{background:#c48e13;color:#152033}.mapspot span{display:block;font-size:17px}.activity-list{display:grid;gap:8px;max-height:370px;overflow:auto}.activity{background:#fff;border:1px solid #e0e1db;padding:11px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.activity small{display:block;color:#718092}.budget{padding:14px;background:var(--navy);color:white;border-radius:15px;margin-bottom:12px}.budget strong{font-size:27px;color:var(--yellow)}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.slot{min-height:130px;border:2px dashed #aeb9bd;border-radius:13px;padding:10px;background:#fbfaf5}.slot h4{margin:0 0 8px}.slot .draggable{display:block;margin:6px 0}.chat{background:#e8edf0;border-radius:16px;padding:15px;min-height:260px;max-height:370px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{padding:10px 13px;border-radius:14px;max-width:82%;line-height:1.4;background:white;color:var(--ink);align-self:flex-start}.bubble.me{background:#d6e8f5;align-self:flex-end}.chatopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.eventcard{background:var(--navy);color:white;border-radius:16px;padding:22px;margin:14px 0}.eventcard h3{color:var(--yellow);margin:0 0 8px}.timer{font-variant-numeric:tabular-nums;color:var(--yellow);font-weight:900}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.note{font-size:13px;color:#667184;background:#eef0eb;padding:12px;border-radius:11px;line-height:1.5}.hidden{display:none!important}.mini{font-size:12px;color:#788495}.result-number{font-size:45px;font-weight:900;letter-spacing:-.05em;color:var(--navy)}.checkline{display:flex;gap:9px;align-items:start;margin:9px 0}.checkline input{margin-top:4px;accent-color:#15243a}.bar{height:10px;background:#e0e4e2;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.city-art{min-height:160px}.two-col,.mapgrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:1fr}.shell{padding:15px}.top{align-items:flex-start}.vocab{grid-template-columns:1fr 1fr}.citymap{min-height:280px}}
@media(max-width:460px){.grid2,.grid3{grid-template-columns:1fr}.vocab{grid-template-columns:1fr}.scorebox{gap:5px}.missionline{font-size:10px}}
</style></head>
<body><div class="shell">
<header class="top"><div><div class="brand">CITY QUEST / ENGLISH MODE</div><div class="mini">THE PERFECT SATURDAY · A2 CHALLENGE</div></div><div class="scorebox"><span>POINTS</span><strong id="score">0</strong><span>·</span><span id="clock" class="timer">60:00</span></div></header>
<div class="missionline"><span id="mission-label">WELCOME TO THE CITY</span><b id="mission-count">START</b></div><div class="progress-wrap"><div class="progress" id="progress"></div></div>
<main id="app"></main><div class="footer"><span>7 missions · 60 minutes · one perfect Saturday</span><span id="save-state">Progress stays on this screen</span></div>
</div>
<script>
const $=s=>document.querySelector(s);let score=0,mission=0,seconds=3600,answers=0,grammarDone=0,listenScore=0,activities=[],timeline={Morning:[],Afternoon:[],Evening:[]},eventsDone=0,chatStep=0,selectedEvents=[],achievements=new Set(),dna={A:0,B:0,C:0,D:0};
const durations=[6,8,7,10,12,10,7];const names=['Your Weekend DNA','The Weekend Vocabulary Lab','Grammar Rescue','Listening: What’s the Plan?','The Ultimate Saturday Planner','Unexpected Events: Plan B!','Convince Your Friend!'];
const add=(n=10)=>{score+=n;$('#score').textContent=score};const award=(x)=>achievements.add(x);function header(){mission=Math.max(0,Math.min(6,mission));$('#mission-label').textContent=mission===0?'MISSION 01 / WARM-UP':`MISSION 0${mission+1} / ${names[mission].toUpperCase()}`;$('#mission-count').textContent=`${mission+1} / 7`;$('#progress').style.width=((mission)/7*100)+'%'}
function frame(content,buttons=''){header();$('#app').innerHTML=`<section class="panel">${content}<div class="actions">${buttons}</div></section>`}
function next(){if(mission<6){mission++;render()}else results()}
function render(){switch(mission){case 0:dnaScreen();break;case 1:vocabScreen();break;case 2:grammarScreen();break;case 3:listeningScreen();break;case 4:plannerScreen();break;case 5:eventScreen();break;case 6:chatScreen();break;}}
function start(){frame(`<div class="hero"><div><div class="eyebrow">A city-planning challenge · 60 minutes</div><h1>THE PERFECT<br><span>SATURDAY</span></h1><p>One friend. €30. Eleven hours. Different opinions. Build a Saturday worth remembering — and defend your choices in English.</p><div class="pill">A2 · SPEAKING</div><div class="pill">7 MISSIONS</div><div class="pill">€30 BUDGET</div></div><div class="city-art"><div class="sun"></div><div class="building"><div class="tower"></div><div class="tower"></div><div class="tower"></div><div class="tower"></div><div class="tower"></div></div></div></div><h3>Your mission briefing</h3><p class="sub">You and your friend are free this Saturday. Your friend cannot meet before 12:00, you must be home by 21:00, and your total budget is <b>€30</b>. Make decisions, deal with surprises and create a plan you both like.</p><div class="note"><b>How to play:</b> Speak your answers out loud before clicking. You can ask for a hint, retry questions and collect points for smart decisions — not just perfect grammar.</div>`,`<button class="btn yellow" onclick="mission=0;render()">START THE CHALLENGE →</button>`)}
const dnaQ=[['It’s Saturday morning. What sounds best?',['Meet friends outside','Stay in and recharge','Try something new'],['A','C','B']],['Your friend suggests shopping. You think it’s boring.',['I’d rather do something else.','That’s the best idea ever!','Maybe, but only for an hour.'],['D','C','B']],['You have €30. What matters most?',['Good food and drinks','Fun activities','Saving some money'],['C','A','D']],['The weather is perfect. You…',['Go somewhere outdoors','Meet a group of friends','Find a new place in the city'],['A','B','B']],['Your plan suddenly changes. You…',['Find a quick alternative','Ask everyone what they prefer','Enjoy a quiet day instead'],['A','B','C']],['You have two free hours. Choose…',['Basketball or skating','A café with friends','A film or gaming'],['A','B','C']],['What makes a day successful?',['Doing something exciting','Good people and good stories','No stress and no overspending'],['A','B','D']],['Your friend is late. You…',['Start another activity','Message the group and decide','Wait somewhere comfortable'],['A','B','C']]];
let dq=0;function dnaScreen(){if(dq>=dnaQ.length){let entries=Object.entries(dna).sort((a,b)=>b[1]-a[1]);let profile={A:['The Adventurer','You like movement, new places and a little competition. A quiet Saturday? Not your first choice.'],B:['The Social Explorer','People make the plan. You enjoy discovering places, meeting friends and keeping the day interesting.'],C:['The Chill Master','You know a good Saturday needs balance. Good company, relaxed plans and time to recharge.'],D:['The Budget Strategist','You make every euro work. You like smart choices and a plan that gives you more for less.']}[entries[0][0]];frame(`<span class="tag">YOUR WEEKEND DNA</span><h2>${profile[0]}</h2><p class="sub">${profile[1]}</p><h3>Tell your teacher:</h3><div class="note">1. Why do you prefer this type of weekend?<br>2. What do you usually do on Saturdays?<br>3. What would make your Saturday perfect?</div><p><b>Useful language:</b> I prefer… · I’d rather… · I’m more interested in… · I enjoy… because…</p>`,`<button class="btn yellow" onclick="add(10);next()">PROFILE UNLOCKED →</button>`);award('Weekend Strategist');return;}let q=dnaQ[dq];frame(`<span class="tag">YOUR WEEKEND DNA · ${dq+1}/8</span><h2>What kind of weekend person are you?</h2><p class="sub">Choose the answer that is most like you. Be ready to explain one choice.</p><div class="question">${q[0]}</div><div class="grid2">${q[1].map((x,i)=>`<button class="choice" onclick="dnaPick(${i})"><b>${String.fromCharCode(65+i)}</b>${x}</button>`).join('')}</div><p class="mini">No wrong answers. Your choices build your weekend profile.</p>`)}function dnaPick(i){let map=dnaQ[dq][2][i];dna[map]++;dq++;add(2);dnaScreen()}
const vocab=[['hang out with friends','spend relaxed time together','🧑‍🤝‍🧑'],['catch a film','go and watch a movie','🎬'],['grab a bite','eat something, usually quickly','🍔'],['spend time outdoors','do activities outside','🌳'],['make plans','decide what you are going to do','🗓️'],['change your mind','decide something different','🔄'],['run out of money','have no money left','💸'],['be in the mood for','feel like doing or having something','🎯'],['look forward to','feel excited about something in the future','✨'],['miss the bus','arrive too late for the bus','🚌'],['meet up','come together at an agreed place','📍'],['stay up late','go to bed later than usual','🌙'],['waste time','use time badly or without a good reason','⌛'],['have a great time','enjoy yourself a lot','🙌']];let matchPairs=[['hang out','with friends'],['catch','a film'],['grab','a bite'],['run out of','money'],['look forward to','the weekend'],['make','plans'],['miss','the bus'],['spend','time outdoors']];let matchDone=0,ctx=0,dialog=0;
function vocabScreen(){frame(`<span class="tag">8 MIN · VOCABULARY LAB</span><h2>Words that make plans work</h2><p class="sub">Explore these expressions. Tap a card to reveal an example, then complete three quick challenges.</p><div class="vocab">${vocab.map((v,i)=>`<button type="button" class="flashcard" aria-expanded="false" aria-label="Reveal meaning and example for ${v[0]}" onclick="this.classList.toggle('flipped');this.setAttribute('aria-expanded',this.classList.contains('flipped'))"><span class="flashcard-inner"><span class="flashcard-face flashcard-front"><strong>${v[2]} ${v[0]}</strong><span class="tap-hint">Tap to reveal ↻</span></span><span class="flashcard-face flashcard-back"><span class="meaning">${v[1]}</span><span class="example">${['We hang out with friends after school.','Let’s catch a film tonight.','We can grab a bite after basketball.','I like to spend time outdoors.'][i%4]}</span><span class="tap-hint">Tap to flip back ↻</span></span></span></button>`).join('')}</div><h3 style="margin-top:20px">Activity A · Build the collocations</h3><p class="sub">Choose the correct ending for each expression.</p><div id="matcharea"></div><div class="actions"><button class="btn yellow" onclick="checkMatches()">CHECK PAIRS</button></div><div id="matchfeedback"></div><h3 style="margin-top:25px">Activity B · Context detective</h3><div id="ctxarea"></div><h3 style="margin-top:22px">Activity C · Mini-dialogues</h3><div id="dialogarea"></div><div class="note"><b>Speaking challenge:</b> Tell me about a time when you changed your mind or ran out of money. What happened?</div>`,`<button class="btn yellow" onclick="add(10);next()">VOCAB LAB COMPLETE →</button>`);buildMatch();buildContext();buildDialogs()}
function buildMatch(){let endings=['with friends','a film','a bite','money','the weekend','plans','the bus','time outdoors'];$('#matcharea').innerHTML=matchPairs.map((p,i)=>`<div class="grid2" style="align-items:center;margin:7px 0"><b>${p[0]} →</b><select class="inline-select" id="m${i}"><option value="">Choose an ending…</option>${endings.map(e=>`<option>${e}</option>`).join('')}</select></div>`).join('')}
function checkMatches(){let n=0;matchPairs.forEach((p,i)=>{if($('#m'+i).value===p[1])n++});$('#matchfeedback').innerHTML=`<div class="feedback ${n===8?'':'bad'}">${n}/8 correct. ${n===8?'Perfect matching!':'Try again — check the meaning of each expression.'}</div>`;if(n===8){add(10);award('Vocabulary Pro')}}
const contexts=[['You and your friend are hungry. You need something quick to eat.',['grab a bite','catch a film','miss the bus'],0],['You arrive at the stop just as the bus leaves. You…',['make plans','miss the bus','stay up late'],1],['You feel excited about your trip next weekend. You…',['look forward to it','waste time','change your mind'],0],['You decided on bowling, but now you prefer basketball. You…',['run out of money','change your mind','meet up'],1],['You want to relax with friends in the park. You…',['hang out with friends','catch a film','miss the bus'],0],['You wanted to buy lunch, but you have spent all your cash. You…',['are in the mood for lunch','have a great time','have run out of money'],2]];function buildContext(){ctx=0;drawContext()}function drawContext(){if(ctx>=contexts.length){$('#ctxarea').innerHTML='<div class="feedback">Context Detective complete. Nice work.</div>';return}let q=contexts[ctx];$('#ctxarea').innerHTML=`<p class="question">${ctx+1}. ${q[0]}</p><div class="grid3">${q[1].map((x,i)=>`<button class="choice" onclick="contextPick(${i})">${x}</button>`).join('')}</div><div id="ctxfb"></div>`}function contextPick(i){let q=contexts[ctx];let ok=i===q[2];$('#ctxfb').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'Exactly!':'Not quite. Think about what is happening in the situation.'}</div>`;if(ok)add(3);setTimeout(()=>{ctx++;drawContext()},850)}
const dialogs=[['“What shall we do on Saturday?” “Let’s ______ first.”',['make plans','miss the bus','run out of money'],0],['“Are you excited about the match?” “Yes, I’m really ______ it.”',['looking forward to','changing my mind','wasting time'],0],['“I’m hungry.” “Let’s ______ near the park.”',['catch a film','grab a bite','stay up late'],1],['“I don’t want to go bowling now.” “Have you ______?”',['missed the bus','changed your mind','met up'],1]];function buildDialogs(){dialog=0;drawDialog()}function drawDialog(){if(dialog>=dialogs.length){$('#dialogarea').innerHTML='<div class="feedback">All four dialogues completed.</div>';return}let q=dialogs[dialog];$('#dialogarea').innerHTML=`<p class="question">${dialog+1}. ${q[0]}</p><div class="grid3">${q[1].map((x,i)=>`<button class="choice" onclick="dialogPick(${i})">${x}</button>`).join('')}</div><div id="dialogfb"></div>`}function dialogPick(i){let q=dialogs[dialog],ok=i===q[2];$('#dialogfb').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'Natural expression!':'Try another expression. Read the whole dialogue.'}</div>`;if(ok)add(3);setTimeout(()=>{dialog++;drawDialog()},800)}
function grammarScreen(){frame(`<span class="tag">7 MIN · GRAMMAR RESCUE</span><h2>Save the Saturday</h2><p class="sub">Alex’s Saturday went wrong. Fix the problems, choose a better plan and keep moving. Short explanations appear only after an incorrect answer.</p><div class="two-col"><div><h3>A · What happened?</h3><p>Last Saturday, Alex planned to meet his friend at 2 p.m. He missed the bus, arrived late, forgot his wallet and couldn’t buy a cinema ticket.</p><div id="seqarea"></div><button class="btn small" onclick="checkSequence()">CHECK ORDER</button><div id="seqfb"></div></div><div><h3>Past Simple · Repair the sentences</h3><div id="corrarea"></div></div></div><hr style="border:0;border-top:1px solid #ddd;margin:22px 0"><h3>B · Plan or spontaneous decision?</h3><div id="futurearea"></div><hr style="border:0;border-top:1px solid #ddd;margin:22px 0"><h3>C · Should, have to or can?</h3><div id="modalarea"></div><hr style="border:0;border-top:1px solid #ddd;margin:22px 0"><h3>D · Grammar under pressure</h3><div id="mixedarea"></div>`,`<button class="btn yellow" onclick="add(10);award('Grammar Rescuer');next()">GRAMMAR RESCUED →</button>`);buildGrammar()}

const places=[['Park','Walk in the park',0,60,'🌳','Park'],['Basketball','Play basketball',5,90,'🏀','Sports court'],['Bowling','Go bowling',9,60,'🎳','Bowling alley'],['Cinema','Watch a film',10,120,'🎬','Cinema'],['Burger','Have a burger',8,45,'🍔','Burger place'],['Snack','Buy a drink and snack',4,30,'🥤','Corner shop'],['Shopping','Visit a shopping centre',0,60,'🛍️','Shopping centre'],['Skate','Go to a skate park',0,60,'🛹','Skate park'],['Arcade','Visit an arcade',7,60,'🕹️','Arcade']];let chosen=[],planValidated=false;function plannerScreen(){frame(`<span class="tag">12 MIN · CITY PLANNER</span><h2>Build your Saturday</h2><p class="sub">Pick at least four activities, plan the order and keep the whole day realistic. Your friend arrives at 12:00. You must be home by 21:00.</p><div class="budget"><div class="mini" style="color:#bac7d4">BUDGET REMAINING</div><strong id="remaining">€30</strong><div class="bar" style="margin-top:8px"><span id="budgetbar" style="width:0%"></span></div><div class="mini" style="color:#bac7d4;margin-top:8px">Spent: <b id="spent">€0</b> · Selected: <b id="activitycount">0</b></div></div><div class="mapgrid"><div class="citymap"><span class="tag">CITY MAP · TAP A PIN TO ADD</span>${[['Park',12,23],['Basketball',63,18],['Bowling',39,54],['Cinema',73,68],['Burger',10,75],['Snack',43,14],['Shopping',73,38],['Skate',17,47],['Arcade',48,83]].map(p=>`<button class="mapspot" style="left:${p[1]}%;top:${p[2]}%" onclick="addActivity('${p[0]}')"><span>📍</span>${p[0]}</button>`).join('')}<div style="position:absolute;bottom:8px;right:12px;color:#64766b;font-size:11px">✦ CITY CENTRE</div></div><div><div class="activity-list">${places.map(p=>`<div class="activity"><div><b>${p[4]} ${p[1]}</b><small>${p[2]===0?'Free':'€'+p[2]} · ${p[3]} min</small></div><button class="btn small" onclick="addActivity('${p[0]}')">+ ADD</button></div>`).join('')}</div><p class="mini">Shopping centre: choose a spend amount of €0–€12 when adding it.</p></div></div><h3 style="margin-t const eventData=[['BAD WEATHER','It is raining heavily. Outdoor activities are no longer possible.',['Move to the arcade and cinema','Keep the park plan','Cancel the whole day'],'Try an indoor option and explain what you will change.'],['BUDGET CUT','Your friend can spend only €10.',['Choose free activities and one cheap snack','Ask your friend to spend more','Go bowling and to the cinema'],'Compare the costs and make a fair plan.'],['CINEMA PROBLEM','All tickets for the afternoon are sold out.',['Choose bowling or the arcade','Wait outside the cinema','Go home immediately'],'Suggest another activity and give a reason.'],['TRANSPORT PROBLEM','The bus is delayed by 40 minutes.',['Meet later and change the order','Pretend the bus is on time','Spend the whole budget on a taxi'],'What can you do while you wait?'],['FRIEND IS LATE','Your friend will arrive two hours later.',['Start with a solo activity nearby','Cancel without messaging','Wait at the meeting point for two hours'],'What are you going to do before your friend arrives?'],['FULLY BOOKED','The bowling alley has no free lanes.',['Choose basketball or the arcade','Argue with the staff','Book the same lane anyway'],'Offer an alternative your friend might enjoy.'],['LOW ENERGY','You are both tired and do not want to walk much.',['Choose one nearby activity and relax','Add three more activities','Go to the skate park across town'],'Make the plan easier and explain why.'],['UNEXPECTED OPPORTUNITY','Your friend has two free tickets for an event, but it starts in 30 minutes.',['Check the location and travel time, then decide','Ignore the tickets','Spend €20 on a different activity'],'Decide quickly. Use “I’ll…” for a spontaneous decision.']];let currentEvent=null;function eventScreen(){frame(`<span class="tag">10 MIN · PLAN B</span><h2>Unexpected events</h2><p class="sub">A perfect plan never stays perfect. Reveal an event, explain the problem, choose a solution and negotiate with your friend. You need at least four rounds.</p><div class="eventcard" id="eventcard"><div class="eyebrow">CITY ALERT / WAITING</div><h3>What’s going to happen?</h3><p>Click the button to reveal a random event. Think before you choose.</p></div><button class="btn yellow" onclick="revealEvent()">⚡ REVEAL EVENT</button><div id="eventoptions"></div><h3 style="margin-top:22px">Your virtual friend</h3><div class="chat" id="eventchat"><div class="bubble">I hope nothing goes wrong… But if it does, we need a Plan B.</div></div><div class="chatopts" id="eventreply"></div><div class="note" style="margin-top:15px"><b>Language support:</b> We could… · We should… · We have to… · We don’t have to… · I’ll… · What about…? · Why don’t we…? · That’s a better idea because…</div>`,`<button class="btn yellow" onclick="if(eventsDone<4){alert('Complete at least four event rounds first.')}else{add(20);award('Problem Solver');next()}">PLAN B COMPLETE →</button>`)}function revealEvent(){let pool=eventData.filter((_,i)=>!selectedEvents.includes(i));if(!pool.length)selectedEvents=[];let index=eventData.indexOf(pool[Math.floor(Math.random()*pool.length)]);selectedEvents.push(index);currentEvent=eventData[index];$('#eventcard').innerHTML=`<div class="eyebrow">CITY ALERT / EVENT ${eventsDone+1}</div><h3>${currentEvent[0]}</h3><p>${currentEvent[1]}</p><div class="mini" style="color:#c6d2dd">Your challenge: ${currentEvent[3]}</div>`;$('#eventoptions').innerHTML=`<h3>Choose your response</h3><div class="grid3">${currentEvent[2].map((x,i)=>`<button class="event-option" onclick="eventPick(${i})">${x}</button>`).join('')}</div><div id="eventfb"></div>`;$('#eventreply').innerHTML='';}function eventPick(i){let good=i===0;let chat=$('#eventchat');chat.innerHTML+=`<div class="bubble me">${currentEvent[2][i]}.</div><div class="bubble">${good?'That could work. But what about the cost and the time?':'I’m not convinced. Can you think of another option?'}</div>`;$('#eventfb').innerHTML=`<div class="feedback">${good?'Flexible thinking!':'Interesting idea. Explain how it solves the problem and what it might cost.'} ${currentEvent[3]}</div>`;if(good)add(5);else add(2);$('#eventreply').innerHTML=`<button class="choice" onclick="eventReply(0)">We could do that because it’s cheaper.</button><button class="choice" onclick="eventReply(1)">Why don’t we choose something nearby?</button><button class="choice" onclick="eventReply(2)">I’ll check the times and message you.</button>`;eventsDone++;}

const negotiation=[{goal:'Invite the friend',friend:'Sounds good! What are you thinking of doing?',opts:['Do you want to hang out this Saturday?','I went to the park yesterday.','I am usually busy.'],correct:0},{goal:'Suggest activities',friend:'I’m not really into shopping. Is there something more active?',opts:['Let’s go bowling or play basketball.','Shopping is always the best.','I don’t know.'],correct:0},{goal:'Discuss prices',friend:'Bowling is €9. The arcade is €7. Which is better?',opts:['The arcade is cheaper than bowling, so we could go there.','The arcade is more expensive.','We don’t need money.'],correct:0},{goal:'Agree on time',friend:'I can meet at 12:30. Is that OK?',opts:['Great. Let’s meet at 12:30 outside the park.','I met you at 12:30 yesterday.','Meet whenever.'],correct:0},{goal:'Respond to disagreement',friend:'I don’t want to watch a film. It’s too expensive.',opts:['That’s fair. We could play basketball instead.','You are wrong.','We have to go.'],correct:0},{goal:'Solve a problem',friend:'It’s raining now. The park isn’t a good idea.',opts:['We’ll choose an indoor activity. What about the arcade?','We are going to get wet.','I don’t care.'],correct:0},{goal:'Confirm the final plan',friend:'So: meet at 12:30, arcade first and then grab a bite?',opts:['Yes. We’re going to meet at 12:30. I’ll bring €15. See you!','Maybe, I don’t know.','I like Saturdays.'],correct:0}];function drawChatOptions(){let step=negotiation[chatStep];if(!step){$('#finalopts').innerHTML='<div class="feedback">All negotiation steps complete. Confirm your voice message checklist.</div>';return}$('#finalopts').innerHTML=`<div class="mini">STEP ${chatStep+1} / ${negotiation.length} · ${step.goal}</div>${step.opts.map((x,i)=>`<button class="choice" style="width:100%;margin-top:7px" onclick="chatPick(${i})">${x}</button>`).join('')}`}
function drawGoals(){let goals=['Invite the friend','Suggest activities','Discuss prices','Agree on a meeting time','Respond to disagreement','Solve one problem','Confirm the final plan'];$('#goalcheck').innerHTML=goals.map((g,i)=>`<div class="checkline"><span id="goal${i}" style="color:#9aa6b0">○</span>${g}</div>`).join('')}
function chatPick(i){let s=negotiation[chatStep],ok=i===s.correct;let chat=$('#finalchat');chat.innerHTML+=`<div class="bubble me">${s.opts[i]}</div><div class="bubble">${ok?s.friend:'Hmm, I’m not sure that answers me. Try a more helpful response.'}</div>`;chat.scrollTop=chat.scrollHeight;if(ok){$('#goal'+chatStep).textContent='✓';$('#goal'+chatStep).style.color='#29845a';add(3);chatStep++;}else{add(1)}drawChatOptions()}
function sendOwn(){let input=$('#ownreply'),v=input.value.trim();if(!v)return;$('#finalchat').innerHTML+=`<div class="bubble me">${v}</div><div class="bubble">Interesting! Can you make your suggestion a little clearer? What do you think we should do?</div>`;input.value='';$('#finalchat').scrollTop=$('#finalchat').scrollHeight;add(1)}function finishChat(){let checked=[...document.querySelectorAll('[id^="finalcheck"]:checked')].length;if(chatStep<negotiation.length){alert('Complete the negotiation steps first.');return}if(checked<4){alert('Tick at least four items in the voice-message checklist.');return}add(20);award('Master Negotiator');results()}
function results(){mission=6;$('#mission-label').textContent='FINAL RESULTS / SATURDAY APPROVED';$('#mission-count').textContent='7 / 7';$('#progress').style.width='100%';let selected=chosen.map(x=>x.name);let spent=chosen.reduce((s,x)=>s+x.cost,0);let ach=['Weekend Strategist','Grammar Rescuer','Listening Detective','Budget Master','Problem Solver','Master Negotiator'];let unlocked=ach.filter(x=>achievements.has(x));$('#app').innerHTML=`<section class="panel"><span class="tag">CHALLENGE COMPLETE</span><h2>Your Saturday is locked in.</h2><p class="sub">You planned, negotiated and survived the unexpected. Here is your final mission report.</p><div class="grid3" style="margin:20px 0"><div><div class="result-number">${score}</div><div class="mini">TOTAL POINTS</div></div><div><div class="result-number">${chosen.length}</div><div class="mini">ACTIVITIES PLANNED</div></div><div><div class="result-number">€${spent}</div><div class="mini">PLANNED SPEND</div></div></div><h3>Your final Saturday itinerary</h3><div class="grid3">${Object.entries(timeline).map(([t,ids])=>`<div class="note"><b>${t}</b><br>${ids.map(id=>{let a=chosen.find(x=>x.id===id);return a?`${a.emoji} ${a.name} (€${a.cost})`:''}).filter(Boolean).join('<br>')||'No activities scheduled'}</div>`).join('')}</div><p><b>Budget remaining:</b> €${30-spent}</p><h3>Achievements unlocked</h3><div class="grid3">${ach.map(a=>`<div class="note">${achievements.has(a)?'🏆':'🔒'} <b>${a}</b><br><small>${achievements.has(a)?'Unlocked':'Not yet unlocked'}</small></div>`).join('')}</div><h3 style="margin-top:20px">Your progress</h3><p class="sub">Grammar checks: ${grammarDone} · Listening points: ${listenScore} · Event rounds: ${eventsDone} · Negotiation steps: ${chatStep}/7</p><div class="note"><b>Teacher feedback:</b> Ask the student to deliver the voice message one more time without looking at the checklist. Praise clear reasons, negotiation and self-correction. Choose one grammar point to review next lesson.</div><div class="actions"><button class="btn yellow" onclick="location.reload()">PLAY AGAIN ↻</button><button class="btn ghost" onclick="window.print()">PRINT RESULTS</button></div></section>`}
let timerStarted=false;function tick(){if(seconds<=0)return;seconds--;let m=Math.floor(seconds/60),s=seconds%60;$('#clock').textContent=`${m}:${String(s).padStart(2,'0')}`;if(seconds===0)$('#clock').textContent='TIME';}setInterval(tick,1000);
start();
</script></body></html>
